name: Sync Icon Indexes

on:
  schedule:
    # Weekly on Sunday 21:17 UTC (Monday morning in Australia).
    - cron: "17 21 * * 0"
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: Rebuild even if upstream SHAs have not changed
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

concurrency:
  group: sync-icon-indexes
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Resolve upstream HEAD SHAs
        id: upstream
        run: |
          set -euo pipefail
          fluent_sha="$(git ls-remote https://github.com/microsoft/fluentui-system-icons.git refs/heads/main | awk '{print $1}')"
          fabric_sha="$(git ls-remote https://github.com/microsoft/fluentui.git refs/heads/master | awk '{print $1}')"
          if [ -z "$fabric_sha" ]; then
            fabric_sha="$(git ls-remote https://github.com/microsoft/fluentui.git refs/heads/main | awk '{print $1}')"
          fi
          flight_sha="$(git ls-remote https://github.com/hashicorp/design-system.git refs/heads/main | awk '{print $1}')"
          redhat_sha="$(git ls-remote https://github.com/RedHat-UX/red-hat-icons.git refs/heads/main | awk '{print $1}')"
          salesforce_version="10.17.0"

          if [ -z "$fluent_sha" ] || [ -z "$fabric_sha" ] || [ -z "$flight_sha" ] || [ -z "$redhat_sha" ]; then
            echo "Unable to resolve one or more upstream SHAs." >&2
            exit 1
          fi

          echo "fluent_sha=$fluent_sha" >> "$GITHUB_OUTPUT"
          echo "fabric_sha=$fabric_sha" >> "$GITHUB_OUTPUT"
          echo "flight_sha=$flight_sha" >> "$GITHUB_OUTPUT"
          echo "redhat_sha=$redhat_sha" >> "$GITHUB_OUTPUT"
          echo "salesforce_version=$salesforce_version" >> "$GITHUB_OUTPUT"

      - name: Probe Azure Portal icon sources
        run: |
          set -euo pipefail
          mkdir -p .tmp
          python azure_portal_icons.py \
            --source-lock .tmp/azure-portal-source.json \
            --previous-source-lock .upstream-azure-portal.json \
            --minimum-count 250 \
            --manifest-minimum-count 100

      - name: Fetch Salesforce SLDS package archive
        id: salesforce_archive
        run: |
          set -euo pipefail
          mkdir -p .tmp
          archive_path=".tmp/salesforce-icons.tgz"
          curl --fail --location --silent --show-error \
            --output "$archive_path" \
            "https://registry.npmjs.org/@salesforce-ux/icons/-/icons-${{ steps.upstream.outputs.salesforce_version }}.tgz"
          archive_sha="$(shasum -a 256 "$archive_path" | awk '{print $1}')"
          echo "archive_sha=$archive_sha" >> "$GITHUB_OUTPUT"

      - name: Discover and fetch AWS Architecture Icons archive
        id: aws_archive
        run: |
          set -euo pipefail
          mkdir -p .tmp
          archive_url="$(python aws_icons.py --discover-archive-url)"
          archive_path=".tmp/aws-architecture-icons.zip"
          curl --fail --location --silent --show-error \
            --output "$archive_path" \
            "$archive_url"
          archive_sha="$(shasum -a 256 "$archive_path" | awk '{print $1}')"
          echo "archive_url=$archive_url" >> "$GITHUB_OUTPUT"
          echo "archive_sha=$archive_sha" >> "$GITHUB_OUTPUT"

      - name: Decide if rebuild is needed
        id: decision
        run: |
          set -euo pipefail
          current_fluent="$(cat .upstream-sha 2>/dev/null || true)"
          current_fabric="$(cat .upstream-fabric-sha 2>/dev/null || true)"
          current_flight="$(jq -r '.commit // empty' .upstream-flight-icons.json 2>/dev/null || true)"
          current_hashicorp_products="$(jq -r '.commit // empty' .upstream-hashicorp-products.json 2>/dev/null || true)"
          current_salesforce_version="$(jq -r '.packageVersion // empty' .upstream-salesforce-icons.json 2>/dev/null || true)"
          current_salesforce_archive="$(jq -r '.archiveSha256 // empty' .upstream-salesforce-icons.json 2>/dev/null || true)"
          current_aws_archive_url="$(jq -r '.archiveUrl // empty' .upstream-aws-icons.json 2>/dev/null || true)"
          current_aws_archive="$(jq -r '.archiveSha256 // empty' .upstream-aws-icons.json 2>/dev/null || true)"
          current_redhat="$(jq -r '.commit // empty' .upstream-redhat-icons.json 2>/dev/null || true)"
          current_azure_lock=".upstream-azure-portal.json"
          probed_azure_lock=".tmp/azure-portal-source.json"
          upstream_fluent="${{ steps.upstream.outputs.fluent_sha }}"
          upstream_fabric="${{ steps.upstream.outputs.fabric_sha }}"
          upstream_flight="${{ steps.upstream.outputs.flight_sha }}"
          upstream_redhat="${{ steps.upstream.outputs.redhat_sha }}"
          upstream_salesforce_version="${{ steps.upstream.outputs.salesforce_version }}"
          upstream_salesforce_archive="${{ steps.salesforce_archive.outputs.archive_sha }}"
          upstream_aws_archive_url="${{ steps.aws_archive.outputs.archive_url }}"
          upstream_aws_archive="${{ steps.aws_archive.outputs.archive_sha }}"
          force="${{ github.event.inputs.force_rebuild || 'false' }}"
          changed="false"

          if [ "$force" = "true" ]; then
            changed="true"
          elif [ "$upstream_fluent" != "$current_fluent" ] || [ "$upstream_fabric" != "$current_fabric" ] || [ "$upstream_flight" != "$current_flight" ] || [ "$upstream_flight" != "$current_hashicorp_products" ] || [ "$upstream_redhat" != "$current_redhat" ] || [ "$upstream_salesforce_version" != "$current_salesforce_version" ] || [ "$upstream_salesforce_archive" != "$current_salesforce_archive" ] || [ "$upstream_aws_archive_url" != "$current_aws_archive_url" ] || [ "$upstream_aws_archive" != "$current_aws_archive" ] || ! cmp -s "$current_azure_lock" "$probed_azure_lock"; then
            changed="true"
          fi

          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "Current Fluent SHA: ${current_fluent:-<none>}"
          echo "Upstream Fluent SHA: $upstream_fluent"
          echo "Current Fabric SHA: ${current_fabric:-<none>}"
          echo "Upstream Fabric SHA: $upstream_fabric"
          echo "Current Flight SHA: ${current_flight:-<none>}"
          echo "Upstream Flight SHA: $upstream_flight"
          echo "Current HashiCorp Products SHA: ${current_hashicorp_products:-<none>}"
          echo "Upstream HashiCorp Products SHA: $upstream_flight"
          echo "Current Salesforce package: ${current_salesforce_version:-<none>} / ${current_salesforce_archive:-<none>}"
          echo "Upstream Salesforce package: $upstream_salesforce_version / $upstream_salesforce_archive"
          echo "Current AWS archive: ${current_aws_archive_url:-<none>} / ${current_aws_archive:-<none>}"
          echo "Upstream AWS archive: $upstream_aws_archive_url / $upstream_aws_archive"
          echo "Current Red Hat SHA: ${current_redhat:-<none>}"
          echo "Upstream Red Hat SHA: $upstream_redhat"
          echo "Azure Portal source changed: $(if cmp -s "$current_azure_lock" "$probed_azure_lock"; then echo false; else echo true; fi)"
          echo "Force rebuild: $force"

      - name: Sparse clone Fluent System assets
        if: steps.decision.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse https://github.com/microsoft/fluentui-system-icons.git .tmp/fluent-system
          cd .tmp/fluent-system
          git sparse-checkout set assets

      - name: Sparse clone Fabric MDL2 components
        if: steps.decision.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse https://github.com/microsoft/fluentui.git .tmp/fluent-fabric
          cd .tmp/fluent-fabric
          git sparse-checkout set \
            packages/react-icons-mdl2/src/components \
            packages/react-icons-mdl2-branded/src/components

      - name: Sparse clone HashiCorp Flight icons
        if: steps.decision.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse https://github.com/hashicorp/design-system.git .tmp/hashicorp-design-system
          cd .tmp/hashicorp-design-system
          git sparse-checkout set packages/flight-icons
          git fetch --depth 1 origin "${{ steps.upstream.outputs.flight_sha }}"
          git checkout --detach "${{ steps.upstream.outputs.flight_sha }}"
          test -f packages/flight-icons/LICENSE.md

      - name: Sparse clone Red Hat icons
        if: steps.decision.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse https://github.com/RedHat-UX/red-hat-icons.git .tmp/red-hat-icons
          cd .tmp/red-hat-icons
          git sparse-checkout set src/standard src/ui src/microns
          git fetch --depth 1 origin "${{ steps.upstream.outputs.redhat_sha }}"
          git checkout --detach "${{ steps.upstream.outputs.redhat_sha }}"
          test -f LICENSE_ICONS.md

      - name: Generate and validate candidate source locks
        if: steps.decision.outputs.changed == 'true'
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import flight_icons
          import redhat_icons
          import salesforce_icons

          from source_lock import validate_candidate_lock

          flight_candidate = Path('.tmp/flight-icons-source.candidate.json')
          hashicorp_products_candidate = Path('.tmp/hashicorp-products-source.candidate.json')
          redhat_candidate = Path('.tmp/redhat-icons-source.candidate.json')
          salesforce_candidate = Path('.tmp/salesforce-icons-source.candidate.json')
          aws_candidate = Path('.tmp/aws-icons-source.candidate.json')

          flight_icons.write_source_lock(
              Path('.tmp/hashicorp-design-system/packages/flight-icons'),
              flight_candidate,
              '${{ steps.upstream.outputs.flight_sha }}',
          )
          flight_icons.write_product_source_lock(
              Path('.tmp/hashicorp-design-system/packages/flight-icons'),
              hashicorp_products_candidate,
              '${{ steps.upstream.outputs.flight_sha }}',
          )
          redhat_icons.write_source_lock(
              Path('.tmp/red-hat-icons'),
              redhat_candidate,
              '${{ steps.upstream.outputs.redhat_sha }}',
          )
          salesforce_icons.write_source_lock(
              Path('.tmp/salesforce-icons.tgz'),
              salesforce_candidate,
          )
          import aws_icons
          aws_icons.write_source_lock(
              Path('.tmp/aws-architecture-icons.zip'),
              aws_candidate,
              '${{ steps.aws_archive.outputs.archive_url }}',
          )
          validate_candidate_lock(
              flight_candidate,
              Path('.upstream-flight-icons.json'),
              source=flight_icons.SOURCE,
              count_fields=('indexedAssetCount', 'indexedFamilyCount'),
              scope_fields=('includedCategories', 'excludedCategories'),
          )
          validate_candidate_lock(
              salesforce_candidate,
              Path('.upstream-salesforce-icons.json'),
              source=salesforce_icons.SOURCE,
              count_fields=('indexedAssetCount', 'indexedFamilyCount'),
              scope_fields=('includedCategories', 'excludedCategories'),
          )
          aws_icons.validate_candidate_lock(
              aws_candidate,
              Path('.upstream-aws-icons.json'),
          )
          validate_candidate_lock(
              hashicorp_products_candidate,
              Path('.upstream-hashicorp-products.json'),
              source=flight_icons.PRODUCT_SOURCE,
              count_fields=('indexedAssetCount', 'indexedFamilyCount'),
              scope_fields=('includedCategories', 'excludedCategories'),
          )
          validate_candidate_lock(
              redhat_candidate,
              Path('.upstream-redhat-icons.json'),
              source=redhat_icons.SOURCE,
              count_fields=('indexedAssetCount', 'indexedFamilyCount'),
              scope_fields=('includedCategories', 'excludedCategories'),
          )
          PY

      - name: Regenerate icon data
        if: steps.decision.outputs.changed == 'true'
        run: |
          set -euo pipefail
          python generate-fabric-metadata.py \
            --components-dir .tmp/fluent-fabric/packages/react-icons-mdl2/src/components \
            --branded-components-dir .tmp/fluent-fabric/packages/react-icons-mdl2-branded/src/components \
            --output fabric-mdl2-metadata.json

          python generate-icon-data.py \
            --fluent-icons-dir .tmp/fluent-system/assets \
            --fabric-components-dir .tmp/fluent-fabric/packages/react-icons-mdl2/src/components \
            --fabric-branded-components-dir .tmp/fluent-fabric/packages/react-icons-mdl2-branded/src/components \
            --fabric-metadata fabric-mdl2-metadata.json \
            --output icon-data.json \
            --fluent-upstream-sha "${{ steps.upstream.outputs.fluent_sha }}" \
            --fabric-upstream-sha "${{ steps.upstream.outputs.fabric_sha }}" \
            --azure-source-lock .tmp/azure-portal-source.json \
            --azure-previous-source-lock .tmp/azure-portal-source.json \
            --azure-minimum-count 250 \
            --azure-manifest-minimum-count 100 \
            --flight-icons-dir .tmp/hashicorp-design-system/packages/flight-icons \
            --flight-source-lock .tmp/flight-icons-source.candidate.json \
            --flight-upstream-sha "${{ steps.upstream.outputs.flight_sha }}" \
            --hashicorp-products-source-lock .tmp/hashicorp-products-source.candidate.json \
            --salesforce-archive .tmp/salesforce-icons.tgz \
            --salesforce-source-lock .tmp/salesforce-icons-source.candidate.json \
            --aws-archive .tmp/aws-architecture-icons.zip \
            --aws-source-lock .tmp/aws-icons-source.candidate.json \
            --redhat-icons-dir .tmp/red-hat-icons \
            --redhat-source-lock .tmp/redhat-icons-source.candidate.json \
            --redhat-upstream-sha "${{ steps.upstream.outputs.redhat_sha }}"

          cp .tmp/flight-icons-source.candidate.json .upstream-flight-icons.json
          cp .tmp/hashicorp-products-source.candidate.json .upstream-hashicorp-products.json
          cp .tmp/salesforce-icons-source.candidate.json .upstream-salesforce-icons.json
          cp .tmp/aws-icons-source.candidate.json .upstream-aws-icons.json
          cp .tmp/redhat-icons-source.candidate.json .upstream-redhat-icons.json
          echo "${{ steps.upstream.outputs.fluent_sha }}" > .upstream-sha
          echo "${{ steps.upstream.outputs.fabric_sha }}" > .upstream-fabric-sha
          cp .tmp/azure-portal-source.json .upstream-azure-portal.json

      - name: Commit and push
        if: steps.decision.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icon-data.json fabric-mdl2-metadata.json .upstream-sha .upstream-fabric-sha .upstream-azure-portal.json .upstream-flight-icons.json .upstream-hashicorp-products.json .upstream-salesforce-icons.json .upstream-aws-icons.json .upstream-redhat-icons.json

          if git diff --cached --quiet; then
            echo "No icon-data changes after rebuild."
            exit 0
          fi

          fluent_short_sha="$(echo '${{ steps.upstream.outputs.fluent_sha }}' | cut -c1-7)"
          fabric_short_sha="$(echo '${{ steps.upstream.outputs.fabric_sha }}' | cut -c1-7)"
          flight_short_sha="$(echo '${{ steps.upstream.outputs.flight_sha }}' | cut -c1-7)"
          redhat_short_sha="$(echo '${{ steps.upstream.outputs.redhat_sha }}' | cut -c1-7)"
          salesforce_version="${{ steps.upstream.outputs.salesforce_version }}"
          aws_short_sha="$(echo '${{ steps.aws_archive.outputs.archive_sha }}' | cut -c1-7)"
          git commit -m "chore: sync icon indexes fluent@${fluent_short_sha} fabric@${fabric_short_sha} hashicorp@${flight_short_sha} salesforce@${salesforce_version} aws@${aws_short_sha} flight@${flight_short_sha} redhat@${redhat_short_sha} azure-portal"
          git push
