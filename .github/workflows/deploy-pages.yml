name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    # Daily repair run so transient Pages failures do not leave the site stale.
    - cron: "47 21 * * *"
  workflow_run:
    workflows:
      - Sync Icon Indexes
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Build site artifact
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html keel.css style.css script.js remote-icon-source.js service-worker.js site.webmanifest icon-data.json robots.txt sitemap.xml _site/
          cp -R icons _site/icons
          python gcp_console_icons.py \
            --package-source-tree gcp-console-icons \
            --archive _site/gcp-console-icons.zip
          export DEPLOYMENT_VERSION="$GITHUB_SHA"
          export DEPLOYMENT_SUMMARY="$(git log -1 --pretty=%s)"
          python3 - <<'PY' > _site/version.json
          import json
          import os
          print(json.dumps({"version": os.environ["DEPLOYMENT_VERSION"], "summary": os.environ["DEPLOYMENT_SUMMARY"]}))
          PY
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
