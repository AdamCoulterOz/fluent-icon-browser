<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluent Icons</title>
    <meta name="description" content="Browse Fluent System and Fabric MDL2 icons by name, meaning, and visual variant.">
    <meta name="keywords" content="Fluent icons, Fluent UI icons, Fabric MDL2 icons, Microsoft icons, SVG icon browser, icon search, developer tools, UI design">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#181a1b" media="(prefers-color-scheme: dark)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="manifest" href="site.webmanifest">
    <link rel="icon" href="icons/fluent-icons.svg" type="image/svg+xml">
    <link rel="icon" href="icons/fluent-icons-192.png" type="image/png">
    <link rel="apple-touch-icon" href="icons/fluent-icons-192.png">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Fluent Icons">
    <meta property="og:description" content="Browse Fluent System and Fabric MDL2 icons by name, meaning, and visual variant.">
    <meta property="og:url" content="https://adamcoulteroz.github.io/fluent-icon-browser/">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Fluent Icons">
    <meta name="twitter:description" content="Search and inspect Fluent System and Fabric MDL2 icon families and SVG variants.">
    <link rel="canonical" href="https://adamcoulteroz.github.io/fluent-icon-browser/">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&amp;family=Hanken+Grotesk:wght@400;500;600;700;800&amp;display=swap">
    <link rel="stylesheet" href="style.css">
    <script>
        if ("serviceWorker" in navigator) {
            const appVersionKey = "fluent-icons-app-version";
            let pendingUpdate = null;
            let dismissedUpdateVersion = null;

            const syncUpdateBannerLayout = () => {
                const banner = document.getElementById("appUpdateBanner");
                const message = document.getElementById("appUpdateMessage");
                if (!banner || !message || banner.hidden) {
                    return;
                }

                banner.classList.remove("is-stacked");
                if (message.scrollWidth > message.clientWidth) {
                    banner.classList.add("is-stacked");
                }
            };

            const showUpdateBanner = (version, summary, registration) => {
                const banner = document.getElementById("appUpdateBanner");
                const message = document.getElementById("appUpdateMessage");
                if (!banner || !message) {
                    return;
                }

                if (dismissedUpdateVersion === version) {
                    return;
                }

                pendingUpdate = { version, registration };
                message.textContent = summary || "A new version of Fluent Icons is ready.";
                banner.hidden = false;
                requestAnimationFrame(syncUpdateBannerLayout);
            };

            const refreshWhenUpdated = async (registration) => {
                try {
                    const response = await fetch("version.json", { cache: "no-store" });
                    if (!response.ok) {
                        return;
                    }

                    const { version, summary } = await response.json();
                    if (!version) {
                        return;
                    }

                    const installedVersion = localStorage.getItem(appVersionKey);
                    if (!installedVersion) {
                        localStorage.setItem(appVersionKey, version);
                        return;
                    }

                    if (installedVersion !== version) {
                        await registration.update();
                        showUpdateBanner(version, summary, registration);
                    }
                } catch (error) {
                    console.warn("Unable to check for an app update:", error);
                }
            };

            window.addEventListener("load", async () => {
                const registration = await navigator.serviceWorker.register("service-worker.js", {
                    updateViaCache: "none"
                });
                await registration.update();
                await refreshWhenUpdated(registration);

                document.getElementById("appUpdateRefresh")?.addEventListener("click", async () => {
                    if (!pendingUpdate) {
                        return;
                    }

                    localStorage.setItem(appVersionKey, pendingUpdate.version);
                    await pendingUpdate.registration.update();
                    window.location.reload();
                });

                document.getElementById("appUpdateDismiss")?.addEventListener("click", () => {
                    dismissedUpdateVersion = pendingUpdate?.version || null;
                    document.getElementById("appUpdateBanner").hidden = true;
                });

                window.addEventListener("focus", () => refreshWhenUpdated(registration));
                window.addEventListener("online", () => refreshWhenUpdated(registration));
                window.addEventListener("resize", syncUpdateBannerLayout);
            });
        }
    </script>
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Fluent Icons",
        "url": "https://adamcoulteroz.github.io/fluent-icon-browser/",
        "description": "Browse Fluent System and Fabric MDL2 icons by name, meaning, and visual variant.",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Any",
        "isAccessibleForFree": true,
        "browserRequirements": "JavaScript is required to search and render the icon catalogue.",
        "author": {
            "@type": "Person",
            "name": "Adam Coulter",
            "url": "https://adamcoulteroz.github.io/"
        }
    }
    </script>
    <noscript><style>.top-bar, .icon-grid { display: none; }</style></noscript>
</head>
<body>
    <div class="container">
        <header class="top-bar">
            <div class="top-bar-row">
                <div class="brand-search">
                    <h1 class="brand-title" aria-label="Icons">
                        <span class="brand-logo" aria-hidden="true">
                            <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
                                <rect x="3" y="3" width="8" height="8" rx="2"></rect>
                                <rect x="13" y="3" width="8" height="8" rx="2"></rect>
                                <rect x="3" y="13" width="8" height="8" rx="2"></rect>
                                <rect x="13" y="13" width="8" height="8" rx="2"></rect>
                            </svg>
                        </span>
                        <span class="brand-text">Icons</span>
                    </h1>
                    <div class="search-wrap">
                        <span class="search-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
                                <circle cx="11" cy="11" r="6"></circle>
                                <line x1="15.5" y1="15.5" x2="20" y2="20"></line>
                            </svg>
                        </span>
                        <input type="text" id="searchInput" placeholder="Search icons by name, description, or metaphors..." />
                        <span id="iconCount" class="search-count-pill" aria-live="polite" aria-label="Visible icon count">0</span>
                    </div>
                </div>
                <div class="top-controls">
                    <div class="segmented-control icon-set-tabs" role="tablist" aria-label="Icon set selection">
                        <button type="button" class="segment-btn set-tab active" id="setTabFluent" data-set="fluent" role="tab" aria-selected="true">Fluent</button>
                        <button type="button" class="segment-btn set-tab" id="setTabFabric" data-set="fabric" role="tab" aria-selected="false">MDL2</button>
                    </div>
                    <div class="segmented-control style-filter" role="tablist" aria-label="Style filter">
                        <button type="button" class="segment-btn style-mode-button icon-mode-button" id="filterModeRegular" data-style-mode="regular" aria-selected="false" aria-label="Regular" title="Regular">
                            <span class="style-mode-icon regular-icon" aria-hidden="true"></span>
                        </button>
                        <button type="button" class="segment-btn style-mode-button icon-mode-button" id="filterModeFilled" data-style-mode="filled" aria-selected="false" aria-label="Solid" title="Solid">
                            <span class="style-mode-icon filled-icon" aria-hidden="true"></span>
                        </button>
                        <button type="button" class="segment-btn style-mode-button icon-mode-button" id="filterModeColor" data-style-mode="color" aria-selected="false" aria-label="Color" title="Color">
                            <span class="style-mode-icon color-icon" aria-hidden="true"></span>
                        </button>
                    </div>
                    <a class="repo-link" href="https://github.com/AdamCoulterOz/fluent-icon-browser" target="_blank" rel="noopener" aria-label="Open GitHub repository" title="GitHub repository">
                        <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
                            <path d="M12 2C6.48 2 2 6.58 2 12.24c0 4.51 2.87 8.34 6.85 9.7.5.09.68-.22.68-.49 0-.24-.01-.88-.01-1.73-2.78.62-3.37-1.38-3.37-1.38-.45-1.19-1.11-1.5-1.11-1.5-.91-.64.07-.63.07-.63 1 .07 1.53 1.06 1.53 1.06.9 1.57 2.35 1.12 2.92.86.09-.67.35-1.12.63-1.38-2.22-.26-4.56-1.14-4.56-5.06 0-1.12.39-2.03 1.03-2.74-.1-.26-.45-1.3.1-2.7 0 0 .84-.28 2.75 1.05A9.3 9.3 0 0 1 12 6.96c.85 0 1.7.12 2.5.34 1.9-1.33 2.74-1.05 2.74-1.05.55 1.4.2 2.44.1 2.7.64.71 1.03 1.62 1.03 2.74 0 3.93-2.34 4.79-4.57 5.05.36.32.68.94.68 1.9 0 1.37-.01 2.47-.01 2.81 0 .27.18.59.69.49A10.15 10.15 0 0 0 22 12.24C22 6.58 17.52 2 12 2Z"></path>
                        </svg>
                    </a>
                </div>
            </div>
        </header>

        <aside class="app-update-banner" id="appUpdateBanner" role="status" aria-live="polite" hidden>
            <strong class="app-update-title">Update available</strong>
            <span class="app-update-message" id="appUpdateMessage"></span>
            <div class="app-update-actions">
                <button type="button" class="app-update-refresh" id="appUpdateRefresh">Reload</button>
                <button type="button" class="app-update-dismiss" id="appUpdateDismiss" aria-label="Dismiss update notification">&times;</button>
            </div>
        </aside>

        <div class="cache-loader" id="cacheLoader" role="status" aria-live="polite" hidden>
            <div class="cache-loader-track" aria-hidden="true">
                <div class="cache-loader-progress" id="cacheLoaderProgress"></div>
            </div>
            <span id="cacheLoaderLabel"></span>
        </div>

        <noscript>
            <main class="noscript-page">
                <article class="noscript-card">
                    <span class="noscript-mark" aria-hidden="true">
                        <svg viewBox="0 0 24 24" focusable="false">
                            <rect x="3" y="3" width="8" height="8" rx="2"></rect>
                            <rect x="13" y="3" width="8" height="8" rx="2"></rect>
                            <rect x="3" y="13" width="8" height="8" rx="2"></rect>
                            <rect x="13" y="13" width="8" height="8" rx="2"></rect>
                        </svg>
                    </span>
                    <p class="noscript-eyebrow">Icon catalogue</p>
                    <h1>Fluent Icons</h1>
                    <p>Browse Fluent System and Fabric MDL2 icon families by name, description, metaphor and available visual variant.</p>
                    <h2>Catalogue features</h2>
                    <ul>
                        <li>Fluent regular, filled and colour SVG variants where available.</li>
                        <li>Fabric MDL2 and branded icon families from upstream Microsoft sources.</li>
                        <li>Searchable names, descriptions, metaphors and source attribution.</li>
                        <li>Shareable icon links plus browser copy and SVG download actions.</li>
                    </ul>
                    <p>The searchable catalogue requires JavaScript because its committed icon index is rendered in the browser.</p>
                    <p><a href="https://github.com/AdamCoulterOz/fluent-icon-browser">View the source and generated catalogue on GitHub</a>.</p>
                </article>
            </main>
        </noscript>

        <div class="icon-grid" id="iconGrid">
            <!-- Icons will be dynamically loaded here -->
        </div>
    </div>

    <footer class="site-footer">
        <a class="site-home-link" href="https://adamcoulteroz.github.io/" aria-label="Back to Adam Coulter's projects and tools">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M19 12H5m6-6-6 6 6 6"></path>
            </svg>
            Adam Coulter — Projects and tools
        </a>
    </footer>

    <div id="iconModal" class="modal" aria-hidden="true">
        <div class="modal-content">
            <button type="button" class="close" aria-label="Close details panel">&times;</button>
            <div class="panel-layout">
                <div class="modal-header panel-meta">
                    <h2 class="panel-title">
                        <button type="button" class="panel-title-trigger" id="modalTitle" aria-label="Show icon details" aria-controls="panelMetaDetails" aria-expanded="false"></button>
                    </h2>
                    <div class="panel-meta-details" id="panelMetaDetails">
                        <p id="modalDescription"></p>
                        <div id="metaphorsList"></div>
                    </div>
                </div>
                <div class="modal-body panel-preview">
                    <div class="panel-preview-header">
                        <div class="panel-toolbar">
                            <div class="segmented-control panel-variant-tabs" role="tablist" aria-label="Icon version selection">
                                <button type="button" class="segment-btn panel-variant-tab icon-mode-button" id="panelVariantRegular" data-variant="regular" aria-selected="false" aria-label="Regular" title="Regular">
                                    <span class="style-mode-icon regular-icon" aria-hidden="true"></span>
                                </button>
                                <button type="button" class="segment-btn panel-variant-tab icon-mode-button" id="panelVariantFilled" data-variant="filled" aria-selected="false" aria-label="Solid" title="Solid">
                                    <span class="style-mode-icon filled-icon" aria-hidden="true"></span>
                                </button>
                                <button type="button" class="segment-btn panel-variant-tab icon-mode-button" id="panelVariantColor" data-variant="color" aria-selected="false" aria-label="Color" title="Color">
                                    <span class="style-mode-icon color-icon" aria-hidden="true"></span>
                                </button>
                            </div>
                            <span class="panel-size-wrap">
                                <select id="panelSizeSelect" class="panel-size-select" aria-label="Icon size"></select>
                            </span>
                            <button type="button" class="panel-icon-toggle" id="panelCurrentColorToggle" aria-pressed="false" aria-label="Use currentColor on download" title="Use currentColor on download">
                                <span class="toolbar-icon currentcolor-icon" aria-hidden="true"></span>
                            </button>
                            <div class="panel-actions-group">
                                <button type="button" class="panel-action-btn" id="panelCopyBtn" aria-label="Copy SVG" title="Copy SVG">
                                    <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
                                        <rect x="9" y="9" width="10" height="11" rx="2"></rect>
                                        <path d="M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1"></path>
                                    </svg>
                                </button>
                                <button type="button" class="panel-action-btn" id="panelDownloadBtn" aria-label="Download SVG" title="Download SVG">
                                    <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
                                        <path d="M12 4v10"></path>
                                        <path d="m8 10 4 4 4-4"></path>
                                        <path d="M5 18h14"></path>
                                    </svg>
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="panel-variants">
                        <div class="variant" id="regularVariant" style="display: none;">
                            <div class="icon-view icon-large" id="regularIcon"></div>
                        </div>
                        <div class="variant" id="filledVariant" style="display: none;">
                            <div class="icon-view icon-large" id="filledIcon"></div>
                        </div>
                        <div class="variant" id="colorVariant" style="display: none;">
                            <div class="icon-view icon-large" id="colorIcon"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
